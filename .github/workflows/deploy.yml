name: Deploy to beginn.me

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::746364933546:role/github-actions-beginn-deploy
          aws-region: us-east-2

      - name: Tell the server to pull the latest site
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy beginn-site" \
            --parameters 'commands=["export HOME=/root","cd /var/www/html","git pull origin main"]' \
            --query "Command.CommandId" --output text)
          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.INSTANCE_ID }}"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.INSTANCE_ID }}" --query "StandardOutputContent" --output text